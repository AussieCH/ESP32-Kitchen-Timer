; Eigenstaendiges Mini-Projekt fuer die ZWEITE MCU des Knob-Boards (ESP32-U4WDH).
; Haelt XSMT (IO32) des PCM5100A dauerhaft HIGH - ohne das bleibt der DAC stumm,
; egal wie korrekt das I2S auf dem S3 laeuft. Einmal flashen, danach vergessen.
;
;   pio run -t upload -d tools/u4wdh_xsmt --upload-port /dev/cu.usbserial-XXXX
;
; Der U4WDH haengt an der USB-UART-Bruecke, meldet sich also als cu.usbserial-*
; (der S3 dagegen nativ als cu.usbmodem*). Taucht er nicht auf: USB-A-auf-C-Kabel
; um 180 Grad drehen.
[env:u4wdh]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
