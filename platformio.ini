; =============================================================================
; Kuechentimer fuer runde ESP32-S3-Knob-Displays. Autark (kein WLAN, kein Home
; Assistant). Arduino-Core 3.x (pioarduino) + LVGL 8.4 + LovyanGFX (ST77916, QSPI).
;
; Ziel: Guition JC3636K718C (Lautsprecher, WS2812-Ring, Haptik, Drehknopf).
;
; Erster Flash MUSS ueber USB (16 MB, eigene Partitionstabelle) und braucht den
; BOOT-Pinhole-Griff - siehe README.
; =============================================================================
[env:guition]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi     ; 8 MB Octal-PSRAM

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -Wno-unused-variable
  ; -D DIAG_MODE        ; Diagnose: gruene Statuszeile auf dem Display und
                        ; Impulsprotokoll des Drehknopfs auf Serial

lib_deps =
    lovyan03/LovyanGFX@^1.2.28   ; >=1.2.28 wegen Panel_ST77916 (QSPI, 360x360)
    lvgl/lvgl@^8.4.0
    adafruit/Adafruit NeoPixel@^1.12.3
